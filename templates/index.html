<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Study AI Tutor</title>
    <style>
        :root {
            --bg: #f4f6fb; --card: #ffffff; --text: #1e2333; --muted: #6b7280;
            --line: #e5e7ef; --accent: #5b5bf0; --accent2: #8b5cf6;
            --user: linear-gradient(135deg, #5b5bf0, #8b5cf6); --ai: #ffffff;
            --code: #14161f; --chip: #eef0ff;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1117; --card: #171a23; --text: #e8eaf2; --muted: #9aa1b2;
                --line: #262a37; --ai: #1b1f2b; --chip: #232746;
            }
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body { font-family: "Segoe UI", system-ui, Arial, sans-serif; background: var(--bg); color: var(--text); }
        .app { max-width: 860px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; padding: 0 12px; }

        /* header */
        .top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 14px 4px; }
        .brand { display: flex; align-items: center; gap: 10px; }
        .logo { width: 42px; height: 42px; border-radius: 12px; background: var(--user); display: grid; place-items: center; font-size: 22px; }
        .brand h1 { font-size: 19px; margin: 0; }
        .brand p { margin: 0; font-size: 12px; color: var(--muted); }
        .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        select { padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); font-size: 14px; }
        .seg { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
        .seg button { border: 0; background: transparent; color: var(--muted); padding: 8px 12px; cursor: pointer; font-size: 14px; }
        .seg button.on { background: var(--accent); color: #fff; }
        .switch { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; user-select: none; }

        /* chat */
        .chat { flex: 1; overflow-y: auto; padding: 8px 2px 16px; scroll-behavior: smooth; }
        .welcome { text-align: center; margin: 40px auto; max-width: 520px; }
        .welcome h2 { margin: 0 0 6px; font-size: 24px; }
        .welcome p { color: var(--muted); margin: 0 0 18px; }
        .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .chip { border: 0; background: var(--chip); color: var(--accent); padding: 9px 14px; border-radius: 999px; cursor: pointer; font-size: 14px; }
        .chip:hover { filter: brightness(0.96); }

        .row { display: flex; gap: 10px; margin: 12px 0; animation: pop .18s ease; }
        .row.user { justify-content: flex-end; }
        .avatar { width: 32px; height: 32px; border-radius: 10px; background: var(--user); display: grid; place-items: center; font-size: 16px; flex: none; }
        .bubble { max-width: 82%; padding: 11px 15px; border-radius: 16px; line-height: 1.55; font-size: 15px; overflow-wrap: anywhere; }
        .user .bubble { background: var(--user); color: #fff; border-bottom-right-radius: 4px; }
        .ai .bubble { background: var(--ai); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
        .bubble p { margin: 0 0 8px; } .bubble p:last-child { margin-bottom: 0; }
        .bubble ul, .bubble ol { margin: 4px 0 8px; padding-left: 22px; }
        .bubble h4 { margin: 10px 0 4px; font-size: 16px; }
        .bubble hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }
        .bubble code { background: rgba(120,120,160,.18); padding: 1px 5px; border-radius: 5px; font-family: Consolas, monospace; font-size: 13.5px; }
        .bubble pre { position: relative; background: var(--code); color: #e6e6f0; padding: 12px; border-radius: 10px; overflow-x: auto; margin: 8px 0; }
        .bubble pre code { background: none; padding: 0; color: inherit; }
        .copy { position: absolute; top: 6px; right: 6px; border: 0; background: #2b2f40; color: #cfd3e6; font-size: 12px; padding: 3px 8px; border-radius: 6px; cursor: pointer; }

        .videos { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
        .videos a { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--text); background: var(--chip); padding: 8px 12px; border-radius: 10px; font-size: 14px; }
        .videos a:hover { outline: 1px solid var(--accent); }

        .dots span { display: inline-block; width: 7px; height: 7px; margin: 0 2px; border-radius: 50%; background: var(--muted); animation: blink 1.1s infinite; }
        .dots span:nth-child(2) { animation-delay: .18s; } .dots span:nth-child(3) { animation-delay: .36s; }
        @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
        @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

        .status { min-height: 20px; text-align: center; font-size: 13px; color: var(--muted); }

        /* composer */
        .composer { display: flex; gap: 8px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 8px; margin-bottom: 14px; box-shadow: 0 6px 20px rgba(60, 60, 120, .08); }
        .composer input { flex: 1; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 16px; padding: 8px 6px; min-width: 0; }
        .round { width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer; font-size: 19px; display: grid; place-items: center; flex: none; }
        .mic { background: var(--chip); color: var(--accent); }
        .mic.listening { background: #ef4444; color: #fff; animation: pulse 1.2s infinite; }
        .send { background: var(--user); color: #fff; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239,68,68,.5); } 100% { box-shadow: 0 0 0 14px rgba(239,68,68,0); } }
        @media (max-width: 560px) { .bubble { max-width: 92%; } .brand p { display: none; } }
    </style>
</head>
<body>
<div class="app">
    <header class="top">
        <div class="brand">
            <div class="logo">🎓</div>
            <div><h1>Study AI</h1><p>Your voice tutor · English &amp; தமிழ்</p></div>
        </div>
        <div class="controls">
            <select id="subject">
                <option>Python</option><option>Java</option><option>Salesforce</option>
                <option>SAP</option><option>PHP</option><option>JavaScript</option><option>SQL</option>
            </select>
            <div class="seg" id="langSeg">
                <button data-lang="en" class="on">English</button>
                <button data-lang="ta">தமிழ்</button>
            </div>
            <label class="switch"><input type="checkbox" id="speakToggle" checked> 🔊 Voice</label>
        </div>
    </header>

    <main id="chat" class="chat">
        <div id="welcome" class="welcome">
            <h2>What do you want to learn today?</h2>
            <p>Type or tap 🎤 and ask. I answer in text and voice.</p>
            <div class="chips">
                <button class="chip" data-q="Explain loops with an example">Explain loops</button>
                <button class="chip" data-q="What is OOP?">What is OOP?</button>
                <button class="chip" data-q="Difference between list and array">List vs array</button>
                <button class="chip" data-q="Give me a YouTube video to learn this subject">🎬 Get a video</button>
            </div>
        </div>
    </main>

    <div id="status" class="status"></div>

    <footer class="composer">
        <button id="mic" class="round mic" title="Speak">🎤</button>
        <input type="text" id="input" placeholder="Ask your question..." autocomplete="off">
        <button id="sendBtn" class="round send" title="Send">➤</button>
    </footer>
</div>
<script src="/static/script.js"></script>
</body>
</html>
